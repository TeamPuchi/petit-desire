[project]
name = "m5-petit-desire"
version = "0.1.0"
description = "Autonomous desire system for M5 Petit - inner drives updated periodically"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "mcp>=1.0.0",
    "python-dotenv>=1.0.0",
    # クラウド版（house 表 STATE#DESIRES・記憶の DynamoDB 版・暗号シュレッダーの鍵）
    "boto3>=1.34.0",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "freezegun>=1.5.0",
    "moto[dynamodb]>=5.0.0",
]

[project.scripts]
desire-updater = "petit_desire.cli:update"
desire-system = "petit_desire.server:main"
desire-status = "petit_desire.cli:status"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["petit_desire", "desire_updater.py"]

[tool.ruff]
# petit-memory と同じ 120（日本語のコメントが多いため）
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
# crypto_shred.py は petit-memory の写し（形を変えない）。service.py・sources.py は docstring の表
per-file-ignores = { "petit_desire/crypto_shred.py" = ["E501"], "petit_desire/service.py" = ["E501"], "petit_desire/sources.py" = ["E501"] }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
